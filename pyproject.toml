[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-platform"
version = "0.1.0"
description = "Sandboxed single coding agent vertical slice"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[project.scripts]
coding-m1 = "coding_platform.cli:main"

[tool.setuptools.packages.find]
include = ["coding_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

\n