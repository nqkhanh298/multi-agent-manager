[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-platform"
version = "0.1.0"
description = "Sandboxed multi-agent coding platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.2",
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.7",
    "redis==7.4.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4", "httpx==0.28.1"]

[project.scripts]
coding-m1 = "coding_platform.cli:main"
coding-platform = "coding_platform.cli:main"

[tool.setuptools.packages.find]
include = ["coding_platform*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".local"]
